name: Preview DB Cleanup

on:
  pull_request:
    types: [closed]
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}

jobs:
  cleanup-preview-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Delete Vercel Preview deployments
        run: node scripts/delete-preview-deployments.js
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_IDS: ${{ vars.VERCEL_GALLERY_PROJECT_ID }},${{ vars.VERCEL_ADMIN_PROJECT_ID }}

      - name: Delete preview schema
        run: node scripts/delete-preview-schema.js
        env:
          DB_HOST: ${{ secrets.PREVIEW_DB_HOST }}
          DB_PORT: ${{ secrets.PREVIEW_DB_PORT }}
          DB_USERNAME: ${{ secrets.PREVIEW_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.PREVIEW_DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.PREVIEW_DB_DATABASE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Comment on PR about cleanup
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const schemaName = `preview_pr_${prNumber}`;

            const comment = `🧹 Preview環境のDBスキーマが削除されました。

            **削除されたスキーマ:** \`${schemaName}\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });
