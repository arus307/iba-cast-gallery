services:
  postgres:
    image: postgres:17-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres} # デフォルト 'postgres'
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password} # デフォルト 'password'
      POSTGRES_DB: ${DB_DATABASE:-ibacastgallery}   # デフォルト 'ibacastgallery'
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432", "-U", "${DB_USERNAME:-postgres}"]
      interval: 10s # チェックの間隔
      timeout: 5s   # タイムアウト
      retries: 5    # リトライ回数

  postgres-e2e:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ibacastgallery
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  test-runner:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "${GALLERY_PORT:-3000}:3000"
      - "${ADMIN_PORT:-3001}:3001"
    environment:
      HOME: /tmp/iba-cast-gallery-test-home
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_TESTING: "true"
      E2E_SERIAL: "true"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-test@example.com}"
      AUTH_SECRET: "${AUTH_SECRET:-dummy_secret_for_local_development}"
      AUTH_GITHUB_ID: "dummy"
      AUTH_GITHUB_SECRET: "dummy"
      AUTH_TRUST_HOST: "true"
      DB_HOST: postgres-e2e
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_MIGRATION_USER_USERNAME: postgres
      DB_MIGRATION_USER_PASSWORD: password
      DB_DATABASE: ibacastgallery
      DB_SCHEMA: public
    depends_on:
      postgres-e2e:
        condition: service_healthy
    command:
      - bash
      - -lc
      - |
        mkdir -p "$$HOME"
        node .yarn/releases/yarn-4.9.0.cjs install --immutable
        node .yarn/releases/yarn-4.9.0.cjs migrate
        touch /tmp/test-runner-ready
        exec sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/test-runner-ready"]
      interval: 2s
      timeout: 2s
      retries: 90

# ボリューム定義
volumes:
  postgres_data: # 上記 services.postgres.volumes で指定した名前付きボリューム
